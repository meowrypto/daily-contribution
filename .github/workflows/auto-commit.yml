name: Auto Commit

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Clone repository manually
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .

    - name: Make a change
      run: |
        echo "Activity update on $(date)" >> log.txt

    - name: Commit and push changes
      run: |
        git add log.txt
        git commit -m "Auto-update contribution graph: $(date +'%Y-%m-%d')"
        git push
