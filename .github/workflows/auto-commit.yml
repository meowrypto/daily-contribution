name: Auto Commit

on:
  schedule:
    - cron: '30 11 * * *'   # هر روز ساعت ۳ بعدازظهر به وقت تهران
  workflow_dispatch:             # دکمه اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config --global user.name "meowrypto"
        git config --global user.email "f.doosti@msn.com"

    - name: Make a change
      run: |
        echo "Activity update on $(date)" >> log.txt

    - name: Commit and push
      run: |
        git add log.txt
        git commit -m "Auto update: $(date +'%Y-%m-%d')" || echo "No changes"
        git push
